<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>班主任工作台 · 本地预览</title>
<style>
/* 班主任工作台 · 橙色主题（按原版截图复刻） */
:root{
  --brand:#f97316; --brand-deep:#ea580c; --brand-soft:#fff1e6; --brand-grad:linear-gradient(100deg,#fb923c,#f97316);
  --bg:#f4f5f7; --card:#fff; --ink:#1f2937; --muted:#8a94a6; --line:#e8ecf1;
  --blue:#3b82f6; --green:#16a34a; --red:#dc2626; --purple:#8b5cf6; --teal:#0d9488;
  --shadow:0 1px 3px rgba(15,23,42,.07),0 1px 2px rgba(15,23,42,.04);
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}

/* 顶栏 */
.topbar{background:var(--brand-grad);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px}
.topbar .logo{font-size:16px;font-weight:700}
.topbar .meta{display:flex;gap:14px;font-size:12.5px;opacity:.95;flex-wrap:wrap}
.topbar .meta b{font-weight:700}
.topbar .spacer{flex:1}
.topbar .storage{background:rgba(255,255,255,.18);border-radius:999px;padding:2px 10px;font-size:12px}

/* 布局 */
.layout{display:flex;min-height:calc(100vh - 46px)}
.sidebar{width:190px;background:#fff;border-right:1px solid var(--line);padding:10px 8px;flex-shrink:0}
.sidebar .side-title{font-size:12px;color:var(--muted);padding:6px 10px}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;cursor:pointer;color:#4b5563;user-select:none}
.nav-item:hover{background:#f6f7f9}
.nav-item.active{background:var(--brand);color:#fff;font-weight:600}
.nav-item .ico{width:18px;text-align:center}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:16px}
.nav-item.active .badge{background:#fff;color:var(--brand)}
.main{flex:1;padding:16px 20px;min-width:0}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.page-title{font-size:17px;font-weight:700}
.page-title small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:8px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

/* 组件 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.btn{cursor:pointer;font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;color:var(--ink);display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:#d6dbe3}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--brand-deep)}
.btn.danger{color:var(--red);border-color:#f3c2c2}
.btn.sm{padding:3px 9px;font-size:12.5px;border-radius:7px}
.btn.link{border:none;background:none;color:var(--brand);padding:3px 4px}
.btn.link.red{color:var(--red)}
.btn.link.green{color:var(--green)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #ffedd5;border-color:var(--brand)}
label.check{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;color:#4b5563}
.pill{display:inline-flex;align-items:center;gap:3px;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.hi{background:#fee2e2;color:var(--red)}
.pill.mid{background:#ffedd5;color:var(--brand-deep)}
.pill.lo{background:#e5e7eb;color:#6b7280}
.pill.ok{background:#dcfce7;color:var(--green)}
.pill.info{background:#dbeafe;color:var(--blue)}
.pill.warn{background:#fef3c7;color:#b45309}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:8px;font-size:12.5px;background:#f1f5f9;color:#475569}
.chip .x{cursor:pointer;opacity:.6}.chip .x:hover{opacity:1}
.statbar{display:flex;gap:0;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.statbar .st{flex:1;text-align:center;padding:14px 8px;border-right:1px solid var(--line)}
.statbar .st:last-child{border-right:none}
.statbar .st b{display:block;font-size:24px;color:var(--brand)}
.statbar .st.warn b{color:var(--red)}
.statbar .st span{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.note-strip{background:#fef2f2;border:1px solid #fecaca;color:var(--red);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px;font-weight:600}
.hint{color:var(--muted);font-size:12.5px;margin:6px 0}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl td{padding:8px 10px;border-bottom:1px solid #f1f4f8;vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr:hover td{background:#fafbfc}
.g-female{color:#ec4899}.g-male{color:var(--blue)}
.leave-name{color:var(--red);font-weight:600}

/* 待办卡片 */
.todo-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.todo-card{background:#fff;border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.todo-card.done{opacity:.55;border-left-color:#cbd5e1}
.todo-card .t-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.todo-card .t-title{font-weight:700;font-size:14.5px}
.todo-card .t-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--muted)}
.todo-card .t-notes{background:#f8fafc;border-radius:8px;padding:7px 10px;margin-top:8px;font-size:13px;color:#475569;white-space:pre-wrap}
.todo-card .t-acts{display:flex;gap:2px;margin-top:8px;flex-wrap:wrap}
.progress-chip{cursor:pointer;background:#fff7ed;border:1px dashed var(--brand);color:var(--brand-deep);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}

/* 宿舍卡片 */
.dorm-sec-title{font-weight:700;margin:14px 0 8px;font-size:14.5px}
.dorm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.dorm-card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.dorm-card .d-head{background:#fff7ed;padding:9px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.dorm-card .d-head .d-name{font-weight:800;font-size:15px}
.dorm-card .d-members{padding:6px 12px 10px}
.d-member{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #f1f4f8;font-size:13.5px}
.d-member:last-child{border-bottom:none}
.d-member .bed{color:var(--muted);font-size:12px;width:30px}
.d-member .phone{color:var(--muted);font-size:12px;margin-left:auto}
.dorm-card .d-foot{padding:0 12px 10px;display:flex;gap:6px}
.dorm-card .d-stat{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.dorm-card .d-leader{background:#fff7ed;padding:5px 12px;font-size:12.5px;color:#9a3412;border-bottom:1px solid var(--line)}
.da-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.da-row > b{min-width:56px}
.da-row label{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:#64748b}

/* 席位桌卡片 */
.table-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.seat-table-card{background:#fffdf7;border:1px solid #f5e6c8;border-radius:10px;padding:10px 12px}
.seat-table-card .s-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.seat-table-card .s-name{font-weight:800;color:#b45309}
.seat-table-card .chip{font-size:15px;font-weight:700;padding:4px 11px}  /* 已入座姓名放大 */
.tb-add{font-size:12px}  /* 待加入下拉字号缩小 */

/* 座次表 */
.seating-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.seat-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;justify-content:center}
.seat-row .row-label{width:44px;text-align:right;color:var(--muted);font-size:12px;flex-shrink:0}
.seat-cell{min-width:86px;height:44px;border-radius:9px;background:#fff1e6;border:1px solid #fdba74;color:var(--brand-deep);
  display:flex;align-items:center;justify-content:center;font-weight:600;cursor:pointer;user-select:none;padding:2px 6px;text-align:center}
.seat-cell:hover{background:#ffe4c7}
.seat-cell.selected{outline:2px solid var(--brand);background:#ffd9b3}
.seat-cell.empty-seat{background:#fafafa;border:1px dashed #d7dde5;color:#c3cbd6;font-weight:400}
/* 座次表提示与异常高亮 */
.alert{margin:8px 0;padding:8px 12px;border-radius:9px;font-size:13px;line-height:1.5}
.alert.warn{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.alert.ok{background:#ecfdf5;color:#065f46;border:1px solid #6ee7b7}
.alert.dup{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.seat-cell.dup{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
.dup-tag{display:inline-block;margin-left:6px;font-size:10px;background:#dc2626;color:#fff;border-radius:6px;padding:0 5px;vertical-align:middle}
.aisle{width:16px;flex-shrink:0}
.seating-footer{display:flex;border:1px solid var(--line);border-radius:8px;margin-top:10px;overflow:hidden;font-size:12.5px;color:var(--muted)}
.seating-footer div{flex:1;text-align:center;padding:6px;background:#fafbfc}
.seating-toolbar{display:flex;gap:8px;flex-wrap:wrap}

/* 课程表 */
.sched-grid{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.sched-grid th{background:#fff7ed;color:#9a3412;padding:9px;border:1px solid var(--line);font-size:13px}
.sched-grid td{border:1px solid var(--line);padding:0;min-width:120px;height:52px;cursor:pointer;vertical-align:middle;text-align:center}
.sched-grid td:hover{background:#fffaf5}
.sched-grid td .subj{font-weight:700;font-size:13.5px}
.sched-grid td .teach{color:var(--muted);font-size:11.5px}
.sched-grid td.period-cell{background:#fafbfc;color:var(--muted);font-size:12.5px;cursor:default;font-weight:600;min-width:56px}
.sched-grid td.even{background:#f0fdf4}

/* 学生勾选（核对/关联花名册） */
.person-pills{display:flex;flex-wrap:wrap;gap:6px}
.person-pill{cursor:pointer;border-radius:999px;padding:4px 12px;font-size:13px;border:1px solid var(--line);background:#fff;user-select:none}
.person-pill.on{background:#dcfce7;border-color:#86efac;color:var(--green);font-weight:600}
.person-pill.off{background:#fee2e2;border-color:#fca5a5;color:var(--red)}
.person-pill.leave{background:#fee2e2;border-color:#fca5a5;color:var(--red);text-decoration:line-through}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;z-index:100;overflow:auto;padding:40px 14px}
.modal{background:#fff;border-radius:14px;width:520px;max-width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal .m-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0;font-size:16.5px;font-weight:800}
.modal .m-close{cursor:pointer;border:none;background:none;font-size:20px;color:#9aa3b2;line-height:1}
.modal .m-body{padding:16px 20px}
.modal .m-foot{display:flex;justify-content:flex-end;gap:10px;padding:0 20px 18px}
.field{margin-bottom:13px}
.field>label{display:block;font-size:13px;color:#64748b;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%}
textarea{resize:vertical;min-height:64px}
.modal-wide{width:680px}

/* Toast */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;border-radius:9px;padding:9px 18px;font-size:13.5px;opacity:0;transition:.25s;z-index:200;pointer-events:none}
#toast.show{opacity:.95}

/* ===== 统计弹窗（请假 / 就餐共用） ===== */
.statbar-flat{box-shadow:none;background:#fafbfc;margin-bottom:12px}
.statbar-flat .st b{font-size:21px}
.statbar-flat .st{padding:10px 6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px;flex-wrap:wrap}
.tabs.sub{border-bottom:none;gap:6px;margin-bottom:8px}
.tab{padding:7px 14px;border-radius:8px 8px 0 0;cursor:pointer;font-size:13.5px;color:#64748b;
  border:1px solid transparent;border-bottom:none;margin-bottom:-1px;user-select:none}
.tab:hover{color:var(--brand-deep);background:#fff7ed}
.tab.on{background:#fff;border-color:var(--line);color:var(--brand-deep);font-weight:700;box-shadow:inset 0 2px 0 var(--brand)}
.tabs.sub .tab{border:1px solid var(--line);border-radius:999px;padding:3px 12px;margin-bottom:0;font-size:12.5px;background:#fff}
.tabs.sub .tab.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:none}
.stat-num{display:flex;align-items:center;gap:8px}
.stat-num b{min-width:18px;text-align:right}
.stat-num i{display:block;height:8px;border-radius:4px;background:var(--brand-grad);opacity:.8;max-width:110px;flex:1}
table.tbl tr.dim td{color:#b3bcc9}
table.tbl tr.dim:hover td{background:#fff}
.wk{font-size:11.5px;color:var(--muted);margin-left:3px}
.muted{color:var(--muted);font-size:12.5px;white-space:nowrap}
.chip.seg{font-size:12px;background:#f1f5f9}
.chip.seg.now{background:#fff1e6;color:var(--brand-deep);font-weight:600}
.chip.seg.clip{background:#f8fafc;border:1px dashed #c7d0dc;color:#5d6b7d}
/* 统计起始日开关 */
.stat-scope{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px;
  padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fffdf8}
.scope-sw{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#334155;
  cursor:pointer;user-select:none;white-space:nowrap}
.scope-sw input{width:15px;height:15px;accent-color:var(--brand);cursor:pointer;margin:0}
.scope-date{padding:2px 6px;border:1px solid var(--line);border-radius:7px;font:inherit;
  font-size:12.5px;color:#334155;background:#fff}
.scope-date:disabled{color:#9aa6b5;background:#f6f8fa;cursor:not-allowed}
.scope-note{font-size:12px;color:var(--muted)}
.scope-note b{color:var(--brand-deep);font-weight:700}
@media (max-width:560px){ .stat-scope{gap:6px 8px} .scope-note{flex-basis:100%} }
.stat-scroll{max-height:56vh;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:0 2px;background:#fff}
.stat-scroll table.tbl th{position:sticky;top:0;background:#fff;z-index:1;box-shadow:inset 0 -1px 0 var(--line)}
.stat-scroll::-webkit-scrollbar{width:8px;height:8px}
.stat-scroll::-webkit-scrollbar-thumb{background:#dde3ea;border-radius:6px}
.stat-scroll table.tbl{min-width:520px}
.stat-scroll table.tbl td b{white-space:nowrap}
@media (max-width:560px){ .stat-scroll table.tbl{min-width:0} }
.mini-chart{display:flex;align-items:flex-end;gap:6px;height:120px;padding:6px 4px 0;
  border-bottom:1px solid var(--line);margin:8px 0 6px;overflow-x:auto}
.mini-chart .col{flex:1;min-width:22px;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;gap:2px}
.mini-chart .col b{font-size:10.5px;color:var(--brand-deep);line-height:1}
.mini-chart .col i{width:100%;max-width:26px;min-height:2px;max-height:calc(100% - 32px);border-radius:4px 4px 0 0;
  background:linear-gradient(180deg,#fb923c,#f97316)}
.mini-chart .col span{font-size:10.5px;color:var(--muted);white-space:nowrap;line-height:1.2}

/* 响应式 */
@media (max-width:900px){
  .layout{flex-direction:column}
  .sidebar{width:100%;display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:6px}
  .sidebar .side-title{display:none}
  .nav-item{white-space:nowrap;flex-shrink:0}
  .grid2,.grid3,.grid4,.todo-grid{grid-template-columns:1fr}
  .statbar{flex-wrap:wrap}.statbar .st{min-width:45%}
  .main{padding:12px}
}

</style>
</head>
<body>
<header class="topbar">
  <span class="logo">👩‍🏫 26电商综合班 · 班主任工作台</span>
  <div class="meta">
    <span>班主任 <b id="tb-teacher">—</b></span>
    <span>班级 <b id="tb-count">0</b> 人</span>
    <span class="storage" title="预览模式下数据存在浏览器本地，不会上传">🖥 本地预览</span>
  </div>
  <div class="spacer"></div>
  <button class="btn sm" id="btn-reset" style="background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.35);color:#fff;margin-right:8px">↺ 重置预览</button>
  <button class="btn sm" id="btn-export" style="background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.35);color:#fff">⬇ 导出备份</button>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="side-title">班级工作台目录</div>
    <div id="nav"></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div id="modal-root"></div>
<div id="toast"></div>

  /* ---------------- 样本数据（一个真实的电商班） ---------------- */

      return { id, name, gender, dorm, bed, parent_phone: phone, major, notes,

    }
    const students = [

      mk(3, '王昶博', '男', '405男', '8', '', '', '', 0, 0, 0),
      mk(4, '李迪', '女', '410女', '4', '13287493692', '多媒体', '', 0, 0, 0),
      mk(5, '杨栋', '男', '413男', '2', '15865101092', '电商', '', 0, 0, 0),
      mk(6, '邵千千', '女', '405女', '6', '18253072331', '计算机', '一个村的，安排一个下铺', 0, 0, 0),
      mk(7, '袁艺珈', '女', '406女', '1', '13905404912', '计算机', '', 0, 0, 0),
      mk(8, '王子阳', '男', '407男', '6', '13854089448', '电商', '姬主任的亲戚，安排下铺。', 0, 0, 0),

  /* ---------------- 就餐自动上报（镜像 worker.js） ---------------- */
  function addDaysStr(d, n) {
    const [y, m, dd] = d.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, dd + n)).toISOString().slice(0, 10);
  }
  // 与 worker.js leaveCoversOn 同口径：销假日 > 预计结束日 > 未定（已销假且无日期则不算）
  function leaveCoversOn(l, date) {
    if (!l.start_date || l.start_date > date) return false;
    const stop = l.returned_at || l.end_date;
    if (stop) return stop >= date;
    return l.status === '请假中';
  }
  function diningStatsFor(date) {
    const total = store.students.length;
    // 按学生去重（重复登记只算一人），与前端 leaveIdsOn 的口径一致
    const onSet = new Set(store.leaves.filter(l => leaveCoversOn(l, date)).map(l => l.student_id));
    const onleave = onSet.size;
    const optout = store.dining_optout.filter(x => x.date === date).length;
    const daily = store.dining_daily.find(x => x.date === date) || {};
    const plus = Number(daily.plus || 0), minus = Number(daily.minus || 0);
    return { date, total, onleave, optout, plus, minus, final: Math.max(0, total - onleave - optout + plus - minus) };
  }
  function ensureDiningHistory() {
    store.dining_history = store.dining_history || [];
    const byDate = new Map(store.dining_history.map(r => [r.date, r]));
    const tomorrow = addDaysStr(T, 1);
    // 明天已有记录（老师已上报）才一起重算，避免凭空生成、也保证删掉的行不再复活
    const until = byDate.has(tomorrow) ? tomorrow : T;
    const starts = [T, ...store.dining_history.map(r => r.date), ...store.dining_daily.map(r => r.date),
      ...store.dining_optout.map(r => r.date), ...store.leaves.map(l => l.start_date)].filter(Boolean).sort();
    let from = starts[0] || T;
    const floor = addDaysStr(T, -6); // 只回溯最近 7 天（含今天）
    if (from < floor) from = floor;
    if (from > until) from = until;
    let changed = false;
    for (let d = from; d <= until; d = addDaysStr(d, 1)) {
      const old = byDate.get(d);
      if (old && old.source !== 'auto' && d < T) continue;  // 历史日的手动记录 = 定稿，不动
      const c = diningStatsFor(d);
      if (old && Number(old.final) === c.final && Number(old.total) === c.total && Number(old.onleave) === c.onleave
        && Number(old.optout) === c.optout && Number(old.plus) === c.plus && Number(old.minus) === c.minus) continue;
      // 今天/明天用手动覆盖时，记住被覆盖的手动值
      const overwritten = (old && old.source !== 'auto') ? Number(old.final) : undefined;
      if (old) Object.assign(old, c, { saved_at: now, source: 'auto',
        manual_final: overwritten !== undefined ? overwritten : (old.manual_final ?? null) });
      else store.dining_history.push({ id: nid(store.dining_history), ...c, saved_at: now, source: 'auto', manual_final: null });
      changed = true;
    }
    if (changed) save();
  }

  function getState() {
    ensureDiningHistory();
    const students = store.students.slice().sort((a, b) =>
      (a.gender < b.gender ? -1 : a.gender > b.gender ? 1 : a.name < b.name ? -1 : 1));
    const leaves = store.leaves.slice().sort((a, b) =>
      (b.start_date || '').localeCompare(a.start_date || '') || b.id - a.id);
    // 已完成超过 3 天的待办真正删除（含级联逐人勾选）
    const cutoff = now - 3 * 86400000;
    store.todo_checks = store.todo_checks.filter(c => {
      const t = store.todos.find(x => x.id === c.todo_id);
      return t && !(t.done && t.done_at && t.done_at < cutoff);
    });
    store.todos = store.todos.filter(t => !(t.done && t.done_at && t.done_at < cutoff));
    return {
      settings: store.settings || {}, students, leaves,
      todos: store.todos, todo_checks: store.todo_checks, dorm_checks: store.dorm_checks,

      dorm_checks: store.dorm_checks, dining_optout: store.dining_optout, dining_daily: store.dining_daily,

        const dorm = String(body.dorm || ''), bed = String(body.bed || '');
        if (dorm && bed) { const taken = store.students.find(x => x.dorm === dorm && x.bed === bed); if (taken) return { status: 409, data: { error: 'bed_taken', name: taken.name } }; }
        const s = { id: nid(store.students), name: String(body.name || '').trim() || '（无名）',
          gender: body.gender === '女' ? '女' : '男', dorm, bed,
          parent_phone: String(body.parent_phone || ''), major: String(body.major || ''), notes: String(body.notes || ''),
          dorm_leader: body.dorm_leader ? 1 : 0, xueji_registered: body.xueji_registered ? 1 : 0,
          insurance_paid: body.insurance_paid ? 1 : 0, xueji_note: String(body.xueji_note || ''), insurance_note: String(body.insurance_note || ''),
          created_at: now };
        store.students.push(s); save(); return { status: 201, data: { ok: true, id: s.id } };
      }
      const id = Number(seg[1]);
      if (method === 'PATCH') {
        const cur = store.students.find(x => x.id === id); if (!cur) return { status: 404, data: { ok: false } };
        const f = (k, d) => body[k] !== undefined ? body[k] : d;
        const curDorm = String(cur.dorm || ''), curBed = String(cur.bed || '');
        const dorm = String(f('dorm', cur.dorm));
        // 换宿舍时：明确给了床号就照办（真撞车 409）；只给宿舍则优先沿用旧床号，
        // 旧床号在新宿舍已被占时退化为「只进宿舍、床号待排」。
        const dormChanged = body.dorm !== undefined && dorm !== curDorm;
        let bed = body.bed !== undefined ? String(body.bed) : curBed;
        if (dorm && bed) {
          const taken = store.students.find(x => x.dorm === dorm && x.bed === bed && x.id !== id);
          if (taken) {
            if (body.bed === undefined && dormChanged) bed = '';
            else return { status: 409, data: { error: 'bed_taken', name: taken.name, bed,
              message: `床号 ${bed} 已被 ${taken.name} 占用` } };
          }
        }
        cur.name = String(f('name', cur.name)).trim() || cur.name;
        cur.gender = f('gender', cur.gender) === '女' ? '女' : '男';
        cur.dorm = dorm; cur.bed = bed;
        cur.parent_phone = String(f('parent_phone', cur.parent_phone)); cur.major = String(f('major', cur.major));
        cur.notes = String(f('notes', cur.notes));
        cur.dorm_leader = f('dorm_leader', cur.dorm_leader) ? 1 : 0;
        cur.xueji_registered = f('xueji_registered', cur.xueji_registered) ? 1 : 0;
        cur.insurance_paid = f('insurance_paid', cur.insurance_paid) ? 1 : 0;
        cur.xueji_note = String(f('xueji_note', cur.xueji_note));
        cur.insurance_note = String(f('insurance_note', cur.insurance_note));
        if (body.dorm_leader === 1 && cur.dorm) store.students.forEach(o => { if (o.dorm === cur.dorm && o.id !== id) o.dorm_leader = 0; });
        save(); return { status: 200, data: { ok: true } };
      }
      if (method === 'DELETE') {
        const delName = (store.students.find(x => x.id === id) || {}).name;
        ['todo_checks', 'dorm_checks', 'dining_optout', 'seats', 'leaves', 'violations']
          .forEach(t => { store[t] = store[t].filter(x => x.student_id !== id); });
        // 座次表按学号存储：同步清掉该生座位（学号匹配 + 姓名匹配兜底旧数据）
        if (store.seating && Array.isArray(store.seating.rows)) {
          for (const row of store.seating.rows) for (let c = 0; c < row.length; c++) if (String(row[c]) === String(id) || row[c] === delName) row[c] = null;
        }
        store.students = store.students.filter(x => x.id !== id); save();
        return { status: 200, data: { ok: true } };
      }
    }

    if (seg[0] === 'dorm-assign' && method === 'PUT') {
      const target = String(body.dorm || '').trim();
      if (!target) return { status: 400, data: { error: 'no_dorm', message: '缺少目标宿舍' } };
      const members = Array.isArray(body.members) ? body.members : [];
      const removeIds = (Array.isArray(body.remove) ? body.remove : []).map(Number);
      const snapshot = store.students.map(s => ({ ...s }));
      const touched = new Set();
      for (const id of removeIds) {
        const s = store.students.find(x => x.id === id);
        if (!s) continue;
        s.dorm = ''; s.bed = ''; s.dorm_leader = 0; touched.add(id);
      }
      for (const mb of members) {
        const s = store.students.find(x => x.id === Number(mb.id));
        if (!s) continue;
        s.dorm = target; s.bed = String(mb.bed ?? '').trim(); s.dorm_leader = mb.leader ? 1 : 0;
        touched.add(s.id);
      }
      // 唯一性校验：只看本次涉及的学生（与 worker.js 的 assignDorm 一致）
      for (const id of touched) {
        const s = store.students.find(x => x.id === id);
        if (!s || !s.dorm || !s.bed) continue;
        const other = store.students.find(o => o.id !== id && o.dorm === s.dorm && o.bed === s.bed);
        if (other) {
          store.students = snapshot;
          return { status: 409, data: { error: 'bed_taken', name: other.name, bed: s.bed, dorm: s.dorm,
            message: `${s.dorm} 的 ${s.bed} 号床已被 ${other.name} 占用` } };
        }
      }
      // 宿舍长唯一：保留最后一个勾选的人
      const leaders = store.students.filter(x => x.dorm === target && x.dorm_leader);
      if (leaders.length > 1) {
        const keep = leaders[leaders.length - 1];
        store.students.forEach(x => { if (x.dorm === target && x.id !== keep.id) x.dorm_leader = 0; });
      }
      if (body.date && body.present && typeof body.present === 'object') {
        for (const [sid, val] of Object.entries(body.present)) {
          const c = store.dorm_checks.find(x => x.student_id === Number(sid) && x.check_date === body.date);
          if (c) c.present = val ? 1 : 0;
          else store.dorm_checks.push({ id: nid(store.dorm_checks), student_id: Number(sid), check_date: body.date, present: val ? 1 : 0 });
        }
      }
      save(); return { status: 200, data: { ok: true } };
    }

    if (seg[0] === 'leaves') {
      if (method === 'POST' && seg.length === 1) {
        const ids = Array.isArray(body.student_ids) ? body.student_ids : (body.student_id ? [body.student_id] : []);
        let n = 0;
        for (const sid of ids) { store.leaves.push({ id: nid(store.leaves), student_id: sid, start_date: body.start_date,
          end_date: body.end_date || null, reason: String(body.reason || ''), status: '请假中', returned_at: null, created_at: now }); n++; }
        save(); return { status: 201, data: { ok: true, added: n } };
      }
      const id = Number(seg[1]);
      if (method === 'PATCH' && seg.length === 2) {
        const cur = store.leaves.find(x => x.id === id); if (!cur) return { status: 404, data: { ok: false } };
        cur.start_date = body.start_date ?? cur.start_date; cur.end_date = body.end_date ?? cur.end_date;
        cur.reason = body.reason ?? cur.reason; cur.status = body.status ?? cur.status; save();
        return { status: 200, data: { ok: true } };
      }
      if (method === 'POST' && seg[2] === 'return') {
        const cur = store.leaves.find(x => x.id === id); if (cur) { cur.status = '已返校'; cur.returned_at = T; save(); }
        return { status: 200, data: { ok: true } };
      }
      if (method === 'DELETE') { store.leaves = store.leaves.filter(x => x.id !== id); save(); return { status: 200, data: { ok: true } }; }
    }

    if (seg[0] === 'todos') {
      if (method === 'POST' && seg.length === 1) {

          category: String(body.category || '其他'), due_date: body.due_date || null,
          priority: ['高', '中', '低'].includes(body.priority) ? body.priority : '中',
          link_roster: body.link_roster ? 1 : 0, notes: String(body.notes || ''),
          created_at: now, done: 0, done_at: null, postpone_count: 0 };
        store.todos.push(t);
        if (t.link_roster) for (const s of store.students) store.todo_checks.push({ id: nid(store.todo_checks), todo_id: t.id, student_id: s.id, checked: 0 });

          let next;
          if (cur.due_date && /^\d{4}-\d{2}-\d{2}$/.test(cur.due_date)) {
            const [y, m, d] = cur.due_date.split('-').map(Number);

          } else next = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
          cur.due_date = next; cur.postpone_count = (cur.postpone_count || 0) + 1;
        } else {
          cur.title = String(body.title ?? cur.title).trim() || cur.title;
          cur.category = String(body.category ?? cur.category);
          cur.due_date = body.due_date !== undefined ? (body.due_date || null) : cur.due_date;
          cur.priority = ['高', '中', '低'].includes(body.priority) ? body.priority : cur.priority;
          cur.link_roster = body.link_roster !== undefined ? (body.link_roster ? 1 : 0) : cur.link_roster;
          cur.notes = String(body.notes ?? cur.notes);
          if (body.link_roster === 1 && !wasLinked) for (const s of store.students) store.todo_checks.push({ id: nid(store.todo_checks), todo_id: id, student_id: s.id, checked: 0 });
        }
        save(); return { status: 200, data: { ok: true } };
      }
      if (method === 'DELETE' && seg.length === 2) {
        store.todo_checks = store.todo_checks.filter(x => x.todo_id !== id);
        store.todos = store.todos.filter(x => x.id !== id); save();
        return { status: 200, data: { ok: true } };
      }
      if (method === 'PUT' && seg[2] === 'checks') {
        const map = body.checks || {};
        for (const [sid, val] of Object.entries(map)) {
          const ex = store.todo_checks.find(x => x.todo_id === id && x.student_id === Number(sid));
          if (ex) ex.checked = val ? 1 : 0; else store.todo_checks.push({ id: nid(store.todo_checks), todo_id: id, student_id: Number(sid), checked: val ? 1 : 0 });
        }
        save(); return { status: 200, data: { ok: true } };
      }
    }

    if (seg[0] === 'dorm-check') {
      if (method === 'PUT') {
        const date = body.date, map = body.present || {};
        for (const [sid, val] of Object.entries(map)) {
          const ex = store.dorm_checks.find(x => x.student_id === Number(sid) && x.check_date === date);
          if (ex) ex.present = val ? 1 : 0; else store.dorm_checks.push({ id: nid(store.dorm_checks), student_id: Number(sid), check_date: date, present: val ? 1 : 0 });
        }
        save(); return { status: 200, data: { ok: true } };
      }
      if (method === 'DELETE') { store.dorm_checks = store.dorm_checks.filter(x => x.check_date !== body.date); save(); return { status: 200, data: { ok: true } }; }
    }

    if (seg[0] === 'dining' && method === 'PUT') {
      const date = body.date;
      if (Array.isArray(body.optout)) { store.dining_optout = store.dining_optout.filter(x => x.date !== date); for (const sid of body.optout) store.dining_optout.push({ id: nid(store.dining_optout), date, student_id: sid }); }
      const plus = Number(body.plus || 0), minus = Number(body.minus || 0);
      const ex = store.dining_daily.find(x => x.date === date);

      const c = diningStatsFor(date);
      const rec = { ...c, saved_at: now, source: 'manual', manual_final: null };  // 手动保存 → 清掉之前被覆盖的记录
      const hEx = store.dining_history.find(x => x.date === date);
      if (hEx) Object.assign(hEx, rec); else store.dining_history.push({ id: nid(store.dining_history), ...rec });
      save(); return { status: 200, data: { ok: true } };
    }

    if (seg[0] === 'tables') {
      if (method === 'POST' && seg.length === 1) {
        const maxPos = store.tables.reduce((m, t) => Math.max(m, t.position || 0), 0);
        const t = { id: nid(store.tables), label: String(body.label || '新桌'), position: maxPos + 1 };
        store.tables.push(t); save(); return { status: 201, data: { ok: true, id: t.id } };
      }
      const id = Number(seg[1]);
      if (method === 'PATCH') { const c = store.tables.find(x => x.id === id); if (c) { c.label = String(body.label || '桌'); save(); } return { status: 200, data: { ok: true } }; }
      if (method === 'DELETE') { store.seats = store.seats.filter(x => x.table_id !== id); store.tables = store.tables.filter(x => x.id !== id); save(); return { status: 200, data: { ok: true } }; }
      if (method === 'PUT' && seg[2] === 'members') {
        const members = Array.isArray(body.members) ? body.members : [];
        store.seats = store.seats.filter(x => x.table_id !== id); let pos = 0;
        for (const sid of members) store.seats.push({ id: nid(store.seats), table_id: id, student_id: sid, position: pos++ });
        save(); return { status: 200, data: { ok: true } };
      }
    }

    if (seg[0] === 'seating' && method === 'PUT') { store.seating = { layout: body.layout || [2, 3, 2], rows: body.rows || [] }; save(); return { status: 200, data: { ok: true } }; }

    if (seg[0] === 'violations') {
      if (method === 'POST' && seg.length === 1) {
        const v = { id: nid(store.violations), student_id: body.student_id, type: String(body.type || '其他违规'), date: body.date, details: String(body.details || ''), action: String(body.action || ''), created_at: now };
        store.violations.push(v); save(); return { status: 201, data: { ok: true, id: v.id } };
      }
      if (method === 'DELETE') { store.violations = store.violations.filter(x => x.id !== Number(seg[1])); save(); return { status: 200, data: { ok: true } }; }
    }

    if (seg[0] === 'schedule' && method === 'PUT') {
      const kind = seg[1] === 'personal' ? 'personal' : 'class';
      store.schedules = store.schedules || {}; store.schedules[kind] = body.data || {}; save();
      return { status: 200, data: { ok: true } };
    }

    if (seg[0] === 'settings' && method === 'PUT') {
      const k = Object.keys(body)[0]; store.settings = store.settings || {}; store.settings[k] = body[k]; save();
      return { status: 200, data: { ok: true } };
    }

    return { status: 404, data: { error: 'Not found: ' + p } };
  }

  window.fetch = async (url, opt = {}) => {
    const u = (typeof url === 'string') ? url : (url && url.url) || '';
    const path = u.replace(/^.*?\/api/, '');
    const method = (opt.method || 'GET').toUpperCase();
    let body = {};
    if (opt.body) { try { body = JSON.parse(opt.body); } catch (e) { body = {}; } }
    const res = route(path, method, body);
    const st = res.status || 200;
    return { ok: st >= 200 && st < 300, status: st, json: async () => res.data, text: async () => JSON.stringify(res.data) };
  };

  const rb = document.getElementById('btn-reset');
  if (rb) rb.addEventListener('click', () => { localStorage.removeItem(KEY); location.reload(); });
})();

function dayDiff(a, b){
  const [y1,m1,d1] = a.split('-').map(Number), [y2,m2,d2] = b.split('-').map(Number);
  return Math.round((Date.UTC(y2,m2-1,d2) - Date.UTC(y1,m1-1,d1)) / 86400000);
}
const WEEK_CN = '日一二三四五六';
function weekdayCN(ds){
  const [y,m,d] = ds.split('-').map(Number);
  return '周' + WEEK_CN[new Date(Date.UTC(y, m-1, d)).getUTCDay()];
}
// 短日期：10-27（同年）/ 2026-10-27（跨年）
function md(ds){
  if (!ds) return '未定';
  const y = String(new Date().getFullYear());
  return ds.slice(0,4) === y ? ds.slice(5) : ds;
}
const stuById = id => S.students.find(x => x.id === Number(id));
// 花名册统一排序：男在前、女在后，同性别按姓名拼音升序（所有选人处共用）
const stuSorted = () => [...S.students].sort((a,b)=>(a.gender===b.gender?0:(a.gender==='男'?-1:1))||a.name.localeCompare(b.name,'zh-Hans-CN'));

async function api(path, method='GET', body) {
  const opt = { method, headers: {'content-type':'application/json'} };
  if (body !== undefined) opt.body = JSON.stringify(body);
  const r = await fetch('/api'+path, opt);
  if (!r.ok) {
    let detail = '';
    try {
      const j = await r.json();
      if (j && j.message) detail = '（' + j.message + '）';
      else if (j && j.error) detail = '（' + (j.name ? j.name + ' · ' : '') + j.error + '）';
    } catch (e) {}
    throw new Error('请求失败 ' + r.status + detail);
  }
  return r.json();
}

/* ---------- 请假联动（核心） ---------- */
// 一条请假记录是否覆盖某一天（与后端 leaveCoversOn 完全同口径）
// 结束点：销假日 > 预计结束日 > 未定（未定且已不是「请假中」则不算覆盖）
function leaveCoversOn(l, d){
  if (!l.start_date || l.start_date > d) return false;
  const stop = l.returned_at || l.end_date;
  if (stop) return stop >= d;
  return l.status === '请假中';
}
function leaveIdsOn(date){
  const set = new Set();
  for (const l of S.leaves) if (leaveCoversOn(l, date)) set.add(l.student_id);
  return set;
}
const uncheckedStu = (f) => S.students.filter(f);

/* ---------- 请假统计（只读派生，不改数据） ---------- */
// 一条请假记录的"实际结束日"：销假日 > 预计结束日 > 未定
const leaveEnd = l => l.returned_at || l.end_date || null;
// 该条记录是否覆盖某一天（未定结束的只算到今天，未来预计结束日也封顶到今天）
function leaveCovers(l, d){
  if (d < l.start_date) return false;
  const end = leaveEnd(l);
  const stop = (!end || end > today()) ? today() : end;
  return d <= stop;
}
// 已请假天数（含首尾）；未销假的算到今天，不把未来的预计日算进去
// 注：全量口径，不受「统计起始日」影响；统计弹窗统一走下面的 stat* 版本
function leaveDays(l){
  const end = leaveEnd(l);
  const stop = (!end || end > today()) ? today() : end;
  return Math.max(1, dayDiff(l.start_date, stop) + 1);
}
// 当日请假学生集合（按学生去重；含已返校但当天仍在假期内的历史记录）
function leaveSetOn(d){
  const set = new Set();
  for (const l of S.leaves) if (leaveCovers(l, d)) set.add(l.student_id);
  return set;
}
// 统计口径：只取花名册里还在的学生
const leaveRows = () => S.leaves.filter(l => stuById(l.student_id));
// 每个学生实际请假的日期集合（多段重叠按天去重）
// 注：全量口径，不受「统计起始日」影响；统计弹窗用 statDaySets(from)
function leaveDaySets(){
  const map = new Map();
  for (const l of leaveRows()) {
    if (!map.has(l.student_id)) map.set(l.student_id, new Set());
    const end = leaveEnd(l);
    const stop = (!end || end > today()) ? today() : end;
    const set = map.get(l.student_id);
    for (let d = l.start_date; d <= stop; d = addDays(d, 1)) set.add(d);
  }
  return map;
}

// 排序：未完成在前，已完成压后；组内按 期限(无期限最后)→优先级→时间 排列。
// done 组按 done_at 升序（刚完成的排最后，符合"标记完成后自动排到后面"的直觉）。
function todoSort(list){
  const pri = p => p==='高' ? 0 : p==='中' ? 1 : 2;
  return [...list].sort((a,b)=>{
    if (!!a.done !== !!b.done) return (a.done?1:0) - (b.done?1:0);
    const da = a.due_date || '9999-99-99', db = b.due_date || '9999-99-99';
    if (da !== db) return da < db ? -1 : 1;
    if (pri(a.priority) !== pri(b.priority)) return pri(a.priority) - pri(b.priority);
    return (a.done_at || a.created_at || 0) - (b.done_at || b.created_at || 0);
  });
}

/* ============ 请假统计（两个维度） ============ */
let lvStatTab = 'date', lvStatRange = 30;
// 统计起始日（含当日）：默认只统计 10/18 及之后，更早的记录不计入；null = 统计全部
const LEAVE_STAT_START = '2026-10-18';
let lvStatStart = LEAVE_STAT_START;

// 一条请假记录在统计窗口内的有效区间：起点不早于起始日，终点封顶今天；无交集返回 null
function statSeg(l, from = lvStatStart){
  const rawEnd = leaveEnd(l);
  const stop = (!rawEnd || rawEnd > today()) ? today() : rawEnd;
  const start = (from && from > l.start_date) ? from : l.start_date;
  if (start > stop) return null;
  return { start, stop, clipped: start !== l.start_date };
}
// 窗口内有交集的请假记录（跨起始日的记录也算，天数只计窗口内部分）
const statLeaves = (from = lvStatStart) => leaveRows().filter(l => statSeg(l, from));
function statDays(l, from = lvStatStart){
  const s = statSeg(l, from);
  return s ? dayDiff(s.start, s.stop) + 1 : 0;
}
// 每个学生在窗口内的请假日期集合（多段重叠按天去重）
function statDaySets(from = lvStatStart){
  const map = new Map();
  for (const l of leaveRows()){
    const s = statSeg(l, from);
    if (!s) continue;
    if (!map.has(l.student_id)) map.set(l.student_id, new Set());
    const set = map.get(l.student_id);
    for (let d = s.start; d <= s.stop; d = addDays(d, 1)) set.add(d);
  }
  return map;
}
const statScopeText = () => lvStatStart ? `${md(lvStatStart)} 起（含当日）` : '全部记录';

// 维度一：按日期——每天有多少学生请假
function leaveStatsByDate(){
  const rows = statLeaves();
  if (!rows.length) return `<div class="empty">${lvStatStart ? `${md(lvStatStart)} 之后还没有请假记录` : '还没有请假记录'}</div>`;
  const end = today();
  const days = [];
  if (lvStatRange === 0) {
    let min = statSeg(rows[0], lvStatStart).start;
    for (const l of rows) { const s = statSeg(l, lvStatStart); if (s.start < min) min = s.start; }
    if (dayDiff(min, end) > 366) min = addDays(end, -366);
    for (let d = min; d <= end; d = addDays(d,1)) days.push(d);
  } else {
    let from = addDays(end, -(lvStatRange - 1));
    if (lvStatStart && lvStatStart > from) from = lvStatStart; // 窗口不从起始日之前开始
    for (let d = from; d <= end; d = addDays(d,1)) days.push(d);
  }
  const list = days.map(d => ({ d, set: leaveSetOn(d) })).reverse(); // 最新在上
  const max = Math.max(1, ...list.map(x => x.set.size));
  const hit = list.filter(x => x.set.size > 0).length;
  const rangeBtn = (v, label) => `<span class="tab ${lvStatRange===v?'on':''}" data-range="${v}">${label}</span>`;
  return `
    <div class="tabs sub">${rangeBtn(7,'近 7 天')}${rangeBtn(30,'近 30 天')}${rangeBtn(0,'全部')}</div>
    <div class="hint">口径：${statScopeText()}；共 ${list.length} 天，其中 ${hit} 天有人请假；人数按学生去重，含已返校但当天仍在假期内的记录。</div>
    <div class="stat-scroll"><table class="tbl">
      <thead><tr><th style="width:110px">日期</th><th style="width:120px">请假人数</th><th>请假学生</th></tr></thead>
      <tbody>${list.map(({d,set}) => `<tr class="${set.size?'':'dim'}">
        <td>${md(d)} <span class="wk">${weekdayCN(d)}</span></td>
        <td><div class="stat-num"><b>${set.size||'—'}</b>${set.size?`<i style="width:${Math.round(set.size/max*100)}%"></i>`:''}</div></td>
        <td>${set.size ? [...set].map(id => `<span class="chip">${esc(stuName(id))}</span>`).join(' ') : '<span class="hint">无人请假</span>'}</td>
      </tr>`).join('')}</tbody>
    </table></div>`;
}
// 维度二：按学生——各请了多少天、起止日期
function leaveStatsByStudent(){
  const rows = statLeaves();
  if (!rows.length) return `<div class="empty">${lvStatStart ? `${md(lvStatStart)} 之后还没有请假记录` : '还没有请假记录'}</div>`;
  const map = new Map();
  for (const l of rows) {
    const k = l.student_id;
    if (!map.has(k)) map.set(k, { sid:k, list:[] });
    map.get(k).list.push(l);
  }
  // 按天去重：同一学生多段重叠时，累计天数不重复计（只计起始日之后的部分）
  const daySets = statDaySets();
  const arr = [...map.values()].map(o => ({ ...o, days: daySets.get(o.sid)?.size || 0 }))
    .sort((a,b) => b.days - a.days || b.list.length - a.list.length || stuName(a.sid).localeCompare(stuName(b.sid),'zh-Hans-CN'));
  return `
    <div class="hint">口径：${statScopeText()}；共 ${arr.length} 名学生（未请假的不列出）；天数含首尾、按天去重，请假中的算到今天；起始日之前请假的那一段只计起始日之后的部分。</div>
    <div class="stat-scroll"><table class="tbl">
      <thead><tr><th style="width:110px">学生</th><th style="width:70px">次数</th><th style="width:80px">合计天数</th><th>请假明细（起 ~ 止）</th></tr></thead>
      <tbody>${arr.map(o => {
        const s = stuById(o.sid);
        const segs = o.list.slice().sort((a,b) => a.start_date < b.start_date ? 1 : -1).map(l => {
          const seg = statSeg(l, lvStatStart);
          const now = l.status === '请假中';
          const clipNote = (seg?.clipped && lvStatStart) ? `（自 ${md(lvStatStart)} 起）` : '';
          const txt = `${md(l.start_date)} ~ ${seg?md(seg.stop):'未定'} · 计 ${statDays(l)} 天${clipNote}${now?'（请假中）':''}`;
          return `<span class="chip seg ${now?'now':''} ${seg?.clipped?'clip':''}">${txt}</span>`;
        }).join(' ');
        return `<tr>
          <td><b>${esc(s.name)}</b> <span class="${s.gender==='女'?'g-female':'g-male'}">${s.gender==='女'?'♀':'♂'}</span>${s.dorm?`<div class="hint" style="margin:0">${esc(s.dorm)}</div>`:''}</td>
          <td>${o.list.length}</td>
          <td><b>${o.days}</b></td>
          <td>${segs}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`;
}

function dormAdjustModal(d){
  const td = today(), leaveSet = leaveIdsOn(td);
  const presentOf = s => { const c = S.dorm_checks.find(c=>c.student_id===s.id&&c.check_date===td); return c?!!c.present:!leaveSet.has(s.id); };
  const byBed = (a,b) => (a.bed||'99').localeCompare(b.bed||'99','zh',{numeric:true});
  const mem = S.students.filter(s=>s.dorm===d).sort(byBed);
  // 本地草稿：加入/移出/改床号/设宿舍长/在校状态都在这里改，点「保存」一次提交。
  // （旧版是每改一项立刻发 PATCH，一旦撞床号 409 就整次中断，学生留在原宿舍。）
  const rows = mem.map(s=>({ id:s.id, name:s.name, bed:String(s.bed||''), leader:!!s.dorm_leader, present:presentOf(s) }));
  const removed = [];
  const pickable = () => stuSorted().filter(s => s.dorm !== d || removed.includes(s.id));
  const freeBed = () => {
    const used = new Set(rows.map(r=>r.bed).filter(Boolean));
    for (let i=1;i<=20;i++) if (!used.has(String(i))) return String(i);
    return '';
  };
  const m = openModal(`${modalHead('⚙ 调整宿舍 · '+d)}
    <div class="m-body">
      <div class="hint">改床号、设宿舍长、勾在校状态；要加人或移出也在这里改，最后点【保存】一次性生效。</div>
      <div id="da-members"></div>
      <div class="field" style="margin-top:12px"><label>加入学生到本宿舍</label>
        <div style="display:flex;gap:8px;align-items:center">
          <select id="da-add" style="flex:1"></select>
          <button class="btn sm primary" id="da-add-btn">＋ 加入</button>
        </div>
        <div class="hint">加入时会自动分配空闲床号，可在上面改成别的床号。</div></div>
      <div id="da-removed" class="hint" style="color:#dc2626"></div>
    </div>
    <div class="m-foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="da-save">保存</button></div>`, true);

  const paint = () => {
    m.querySelector('#da-members').innerHTML = rows.map((r,i)=>`
      <div class="da-row" data-i="${i}">
        <b>${esc(r.name)}</b>
        <label>床号<input class="da-bed" value="${esc(r.bed)}" style="width:64px"></label>
        <label class="check"><input type="checkbox" class="da-leader" ${r.leader?'checked':''}> 宿舍长</label>
        <label class="check"><input type="checkbox" class="da-present" ${r.present?'checked':''}> 在校</label>
        <button class="btn sm danger da-remove">移出</button>
      </div>`).join('') || '<div class="empty">本宿舍暂无学生</div>';
    const sel = m.querySelector('#da-add');
    const opts = pickable();
    sel.innerHTML = '<option value="">— 选择学生 —</option>' +
      opts.map(s=>`<option value="${s.id}">${esc(s.name)}（现 ${esc(s.dorm||'未分')}${s.bed?' · '+esc(s.bed)+' 床':''}）</option>`).join('');
    m.querySelector('#da-add-btn').disabled = !opts.length;
    m.querySelector('#da-removed').textContent = removed.length
      ? '待移出（保存后变「未分宿舍」）：' + removed.map(id=>stuName(id)).join('、') : '';
  };

  const box = m.querySelector('#da-members');
  box.addEventListener('input', e => {
    const row = e.target.closest('.da-row'); if (!row) return;
    const r = rows[Number(row.dataset.i)];
    if (e.target.classList.contains('da-bed')) r.bed = e.target.value.trim();
  });
  box.addEventListener('change', e => {
    const row = e.target.closest('.da-row'); if (!row) return;
    const i = Number(row.dataset.i), r = rows[i];
    if (e.target.classList.contains('da-leader')) {
      r.leader = e.target.checked;
      if (r.leader) { // 一间宿舍只有一个宿舍长
        rows.forEach((o,k)=>{ if (k!==i) o.leader = false; });
        box.querySelectorAll('.da-leader').forEach((el,k)=>{ if (k!==i) el.checked = false; });

    const sid = Number(m.querySelector('#da-add').value);

    rows.push({ id:s.id, name:s.name, bed:freeBed(), leader:false, present:!leaveSet.has(s.id) });
    paint();
    toast('已加入，记得点保存');
  };
  paint();

  m.querySelector('#da-save').onclick = async () => {
    // 前端预检：同宿舍床号不能重复
    const seen = new Map();
    for (const r of rows) {
      if (!r.bed) continue;
      if (seen.has(r.bed)) return alert(`床号 ${r.bed} 被 ${seen.get(r.bed)} 和 ${r.name} 同时占用，请改成不同的床号。`);
      seen.set(r.bed, r.name);
    }
    const present = {};
    for (const r of rows) present[r.id] = r.present ? 1 : 0;
    const btn = m.querySelector('#da-save');
    btn.disabled = true; btn.textContent = '保存中…';
    try {
      await api('/dorm-assign','PUT',{
        dorm: d,
        members: rows.map(r=>({ id:r.id, bed:r.bed, leader:r.leader ? 1 : 0 })),
        remove: removed,
        date: td,
        present,
      });
    } catch (err) {
      btn.disabled = false; btn.textContent = '保存';
      return alert('保存失败：' + err.message + '\n（数据没有被改动，可以改完再试）');
    }
    closeModal(); await refresh(); toast('已保存 ' + d);
  };
}
function dormCheckModal(){
  const td = today(), leaveSet = leaveIdsOn(td);
  const meta = S.settings.dorm_meta||{};
  const state = {}; // sid -> present
  for (const s of S.students) {
    const c = S.dorm_checks.find(c=>c.student_id===s.id&&c.check_date===td);
    state[s.id] = c ? !!c.present : !leaveSet.has(s.id);
  }
  const summary = () => {
    const onLeave = S.students.filter(s=>leaveSet.has(s.id)).length;
    const present = Object.values(state).filter(Boolean).length;
    const mismatch = S.students.filter(s=>!state[s.id]&&!leaveSet.has(s.id)).length;
    return `全班 ${S.students.length} 人：在校 ${present} 人 · 请假 ${onLeave} 人 · 实到不符 ${mismatch} 人`;
  };
  const dormBlock = (title, dorms) => {
    const mem = dorms.flatMap(membersOfDorm);
    function membersOfDorm(d){ return S.students.filter(s=>s.dorm===d).sort((a,b)=>(a.bed||'99').localeCompare(b.bed||'99','zh',{numeric:true})); }
    const onLeave = mem.filter(s=>leaveSet.has(s.id)).length;
    return `<div class="dorm-sec-title">${title}（${dorms.length} 间 · ${mem.length} 人）　在校 ${mem.filter(s=>state[s.id]).length}/${mem.length} 人 · 请假 ${onLeave} 人</div>` +
      dorms.map(d=>{
        const dm = membersOfDorm(d);
        const onL = dm.filter(s=>leaveSet.has(s.id)).length;
        return `<div class="field"><label><b>${d}</b>（${dm.length} 人）　在校 ${dm.filter(s=>state[s.id]).length}/${dm.length} 人 · 请假 ${onL} 人</label>
          <div class="person-pills">${dm.map(s=>
            `<span class="person-pill ${state[s.id]?'on':'off'} ${leaveSet.has(s.id)?'leave':''}" data-id="${s.id}">${esc(s.name)}${leaveSet.has(s.id)?'（请假）':''}</span>`).join('')}</div></div>`;
      }).join('');
  };
  const m = openModal(`${modalHead('🏠 宿舍人数核对')}
    <div class="m-body">
      <div class="hint">已自动把「请假中」标为不在校，其余标为在校；可点名字手动切换，保存后就餐/统计实时联动。</div>
      <div class="note-strip" id="dc-sum" style="background:#f8fafc;border-color:var(--line);color:var(--ink)">${summary()}</div>
      ${dormBlock('👦 男生宿舍', DORMS.filter(d=>d.endsWith('男')))}
      ${dormBlock('👧 女生宿舍', DORMS.filter(d=>d.endsWith('女')))}
    </div>
    <div class="m-foot">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn" id="dc-reset">按请假重置</button>
      <button class="btn" id="dc-all">全部在校</button>
      <button class="btn primary" id="dc-save">保存核对</button>
    </div>`, true);
  const updatePills = () => m.querySelectorAll('.person-pill').forEach(p=>{
    const on = state[p.dataset.id];
    p.classList.toggle('on', !!on); p.classList.toggle('off', !on);
    m.querySelector('#dc-sum').textContent = summary();
  });
  m.querySelectorAll('.person-pill').forEach(p=>p.onclick=()=>{ state[p.dataset.id]=!state[p.dataset.id]; updatePills(); });
  m.querySelector('#dc-all').onclick = ()=>{ for(const k in state) state[k]=true; updatePills(); };
  m.querySelector('#dc-reset').onclick = ()=>{ for(const s of S.students) state[s.id]=!leaveSet.has(s.id); updatePills(); };
  m.querySelector('#dc-save').onclick = async ()=>{
    await api('/dorm-check','PUT',{date:td, present:state});
    closeModal(); await refresh(); toast('核对已保存');
  };
}

// 来源标签：自动上报覆盖过手动值时，把被覆盖的手动人数一并显示出来，便于对账
function srcPill(r){
  if (r.source !== 'auto') return '<span class="pill ok">手动</span>';
  const mf = r.manual_final;
  return '<span class="pill lo">自动</span>' + (mf===null||mf===undefined||mf===''?'':`<span class="chip" style="margin-left:4px">曾手动 ${Number(mf)||0}</span>`);
}

function diningStatsModal(){
  const rows = [...S.dining_history].sort((a,b) => a.date < b.date ? 1 : -1); // 最新在上
  if (!rows.length) {
    openModal(`${modalHead('📊 就餐统计')}

      <div class="m-foot"><button class="btn primary" onclick="closeModal()">关闭</button></div>`, true);
    return;
  }
  const finals = rows.map(r => Number(r.final)||0);
  const avg = Math.round(finals.reduce((a,b)=>a+b,0) / finals.length);
  const maxV = Math.max(...finals), minV = Math.min(...finals);
  const last = rows[0];
  const recent = rows.slice(0, 14).reverse(); // 图上从旧到新
  const peak = Math.max(1, ...recent.map(r => Number(r.final)||0));
  const hm = ts => { if (!ts) return '—'; const d = new Date(Number(ts));
    return `${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  openModal(`${modalHead('📊 就餐统计')}
    <div class="m-body">
      <div class="statbar statbar-flat">
        <div class="st"><b>${rows.length}</b><span>已上报天数</span></div>
        <div class="st"><b>${avg}</b><span>平均就餐</span></div>
        <div class="st"><b>${Number(last.final)||0}</b><span>最近一次（${md(last.date)}）</span></div>
        <div class="st"><b>${maxV}<span style="font-size:13px;color:var(--muted)"> / ${minV}</span></b><span>最高 / 最低</span></div>
      </div>
      <div class="hint">每天记一行：今天、明天以<b>系统自动重算</b>为准（数据更晚更准，会覆盖早先的手动上报，并在来源里留「曾手动 42」）；今天以前的手动记录视为定稿，不会被改写。</div>
      <div class="mini-chart">${recent.map(r => {
        const v = Number(r.final)||0;
        return `<div class="col" title="${esc(r.date)}：${v} 人"><b>${v}</b><i style="height:${Math.round(v/peak*100)}%"></i><span>${md(r.date)}</span></div>`;
      }).join('')}</div>
      <div class="hint" style="text-align:center">最近 ${recent.length} 天就餐人数趋势</div>
      <div class="stat-scroll"><table class="tbl">
        <thead><tr><th>就餐日期</th><th>就餐人数</th><th>总人数</th><th>请假</th><th>不就餐</th><th>手动±</th><th>上报时间</th><th>来源</th></tr></thead>
        <tbody>${rows.map(r => `<tr>
          <td>${md(r.date)} <span class="wk">${weekdayCN(r.date)}</span></td>
          <td><b style="color:var(--brand-deep);font-size:15px">${Number(r.final)||0}</b></td>
          <td>${r.total||0}</td>
          <td>${r.onleave||0}</td>
          <td>${r.optout||0}</td>
          <td>${(Number(r.plus)||0)-(Number(r.minus)||0)}</td>
          <td class="muted">${r.source==='auto'?'—':hm(r.saved_at)}</td>
          <td>${srcPill(r)}</td>
        </tr>`).join('')}</tbody>
      </table></div>

/* ============ 页面：座次表 ============ */
function pgSeating(){
  const seat = S.seating || {layout:[2,3,2], rows:[]};
  const layout = seat.layout, rows = seat.rows;
  const colsTotal = layout.reduce((a,b)=>a+b,0) + (layout.length-1);
  // 物理列 -> 是否走道
  const colMap = []; let gi = 0;
  for (let g=0; g<layout.length; g++){ for(let i=0;i<layout[g];i++) colMap.push({seat:true,g}); if(g<layout.length-1) colMap.push({seat:false}); }
  const perRow = layout.reduce((a,b)=>a+b,0);
  // 孤儿值防御：格子里残留的学号/旧姓名反查不到学生（如已删学生）→ 一律视为空位
  const cellStu = rows.map(row => (row||[]).map(v => v ? stuById(v) : null));
  const used = cellStu.flat().filter(Boolean).length;
  // 规则2：全员必须有座 —— 统计未安排、重复占座、座位容量
  const allIds = stuSorted().map(s=>s.id);
  const placed = new Set(cellStu.flat().filter(Boolean).map(s=>s.id));
  const missing = allIds.filter(id => !placed.has(id));
  const counts = {}; cellStu.flat().forEach(s => { if (s) counts[s.id] = (counts[s.id]||0)+1; });
  const dups = Object.keys(counts).filter(k => counts[k] > 1).map(Number);
  const dupSet = new Set(dups);
  const totalSeats = rows.length ? rows.length * perRow : 0;
  const alerts = [];
  if (dups.length) alerts.push(`<div class="alert dup">⚠️ 数据异常：以下学生出现 <b>重复座位</b>（${dups.map(id=>esc(stuName(id))).join('、')}），请点「清空」或重新安排。</div>`);
  if (missing.length) alerts.push(`<div class="alert warn">⚠️ 还有 <b>${missing.length}</b> 人未安排座位：${missing.map(s=>`<b>${esc(s.name)}</b>`).join('、')}</div>`);
  else if (!dups.length) alerts.push(`<div class="alert ok">✅ 全班 ${allIds.length} 人已全部安排座位，无重复。</div>`);
  if (totalSeats && totalSeats < allIds.length) alerts.push(`<div class="alert warn">🪑 座位不足：座位 ${totalSeats} 个 &lt; 学生 ${allIds.length} 人，至少 ${allIds.length - totalSeats} 人无法入座，请增加排数或调整布局。</div>`);
  $('#main').innerHTML = `
    <div class="page-head"><div class="page-title">🪑 座次表<small>排 ${used} 人 · 缺 ${missing.length} 人 · ${layout.join('·')} · 第 1 排在最下方（靠近讲台）</small></div>
      <div class="seating-toolbar">
        <button class="btn" title="${seatTopLabel()?('将撤销：'+seatTopLabel()):'无可撤销的操作'}" onclick="seatUndoPop()">↩ 撤销${seatUndo.length?` (${seatUndo.length})`:''}</button>
        <button class="btn" onclick="seatFillMissing()">➕ 补齐缺座</button>
        <button class="btn" onclick="seatExportModal()">📤 导出座次表</button>
        <button class="btn" onclick="seatLayoutModal()">🔲 布局</button>
        <button class="btn" onclick="seatAuto()">⚡ 自动排座</button>
        <button class="btn danger" onclick="seatClear()">🗑 清空</button>
      </div></div>
    <div class="hint">点一个座位再点另一个即可对调；点空位弹出列表选人放入（同一人不会重复占座，后安排会替换前一个）。</div>
    ${alerts.join('')}
    <div class="seating-wrap">
      ${[...rows.keys()].reverse().map(ri=>{
        const ri2 = ri;
        return `<div class="seat-row"><span class="row-label">第${ri2+1}排</span>
          ${colMap.map((cm,ci)=> cm.seat
            ? `<div class="seat-cell ${cellStu[ri2][ci]?'':'empty-seat'} ${seatSel.r===ri2&&seatSel.c===ci?'selected':''} ${cellStu[ri2][ci]&&dupSet.has(cellStu[ri2][ci].id)?'dup':''}"
                 onclick="seatClick(${ri2},${ci})">${cellStu[ri2][ci]?esc(cellStu[ri2][ci].name)+(dupSet.has(cellStu[ri2][ci].id)?'<span class="dup-tag">重复</span>':''):'空'}</div>`
            : `<div class="aisle"></div>`).join('')}
          <span class="row-label" style="text-align:left">${'窗'}</span></div>`;
      }).join('')}
      <div class="seating-footer"><div>🚪 门（讲台左侧）</div><div>📢 讲台（前面）</div><div>🪟 窗（讲台右侧）</div></div>
    </div>`;
}
function seatSnapshot(){ const s=S.seating||{layout:[2,3,2],rows:[]}; return JSON.parse(JSON.stringify(s)); }
// 撤销栈：每次「改动前」压入当前快照 + 操作说明（撤销本身不再压栈）
function seatPush(label){ seatUndo.push({ snap: seatSnapshot(), label: label||'上次操作' }); if(seatUndo.length>30) seatUndo.shift(); }
function seatTopLabel(){ return seatUndo.length ? seatUndo[seatUndo.length-1].label : ''; }
// 纯提交：本地即时生效 + 写库并刷新，不碰撤销栈（保存前自愈：孤儿值清成 null）
async function seatPut(next){ if (next && Array.isArray(next.rows)) next.rows = next.rows.map(row => (row||[]).map(v => v && stuById(v) ? v : null)); S.seating = next; render(); await api('/seating','PUT',next); await refresh(); }
async function seatSave(next, label){ seatPush(label); await seatPut(next); }
function seatClick(r,c){
  const seat = seatSnapshot();
  if (!seat.rows[r]) seat.rows[r] = [];
  if (seatSel.r<0){ if (seat.rows[r][c] && stuById(seat.rows[r][c])) { seatSel.r=r; seatSel.c=c; } else { seatNameModal(r,c); } }
  else {
    const a=seat.rows[seatSel.r][seatSel.c], b=stuById(seat.rows[r][c]) ? seat.rows[r][c] : null;
    seat.rows[r][c]=a; seat.rows[seatSel.r][seatSel.c]=b;
    const label = (stuName(a)&&stuName(b)) ? `对调 ${stuName(a)}↔${stuName(b)}` : '对调座位';
    seatSel.r=-1; seatSel.c=-1;
    seatSave(seat, label);
  }
  render();
}
function seatNameModal(r,c){
  const cur = (S.seating && S.seating.rows[r] && S.seating.rows[r][c]) || '';
  const opts = stuSorted().map(s=>`<option value="${s.id}" ${String(cur)===String(s.id)?'selected':''}>${esc(s.name)}</option>`).join('');
  const m = openModal(`${modalHead('👤 安排座位')}
    <div class="m-body">
      <div class="field"><label>第${r+1}排 · 第${c+1}列</label><select id="sn-sel" class="tb-add">${opts}</select></div>
      <div class="hint">选一名学生放入该座位；也可「清空」此座位。</div>
    </div>
    <div class="m-foot"><button class="btn" onclick="closeModal()">取消</button>
      <button class="btn" onclick="seatClearCell(${r},${c})">清空</button>
      <button class="btn primary" id="sn-ok">确定</button></div>`);
  m.querySelector('#sn-ok').onclick = () => {
    const sid = Number(m.querySelector('#sn-sel').value);
    if (!sid) return;
    closeModal();
    const seat = seatSnapshot(); seat.rows[r] = seat.rows[r] || [];
    // 规则1：同一人不能占两个座位——安排前先清掉该生其它所有座位（后安排替换前一个）
    for (let rr=0; rr<seat.rows.length; rr++){
      const row = seat.rows[rr]; if (!row) continue;
      for (let cc=0; cc<row.length; cc++) if (String(row[cc]) === String(sid)) row[cc] = null;
    }
    seat.rows[r][c] = sid; seatSave(seat, '安排 '+stuName(sid)+' 入座');
  };
}
function seatClearCell(r,c){ const seat=seatSnapshot(); seat.rows[r]=seat.rows[r]||[]; seat.rows[r][c]=null; seatSave(seat, '清空座位'); }
function seatUndoPop(){ if(!seatUndo.length) return toast('没有可撤销的操作'); const top = seatUndo.pop(); seatPut(top.snap); toast('已撤销：'+top.label); }
function seatAuto(){
  const seat = seatSnapshot();
  const ids = stuSorted().map(s=>s.id);
  const perRow = seat.layout.reduce((a,b)=>a+b,0);
  const colTotal = perRow + seat.layout.length-1;
  const nRows = Math.max(1, Math.ceil(ids.length/perRow));
  const rows = Array.from({length:nRows},()=>Array(colTotal).fill(null));
  let k=0;
  const colMap=[]; for(let g=0;g<seat.layout.length;g++){ for(let i=0;i<seat.layout[g];i++) colMap.push(true); if(g<seat.layout.length-1) colMap.push(false); }
  for (let r=0;r<nRows;r++) for (let c=0;c<colTotal;c++) if (colMap[c] && k<ids.length) rows[r][c]=ids[k++];
  while (rows.length && rows[rows.length-1].every(x=>!x)) rows.pop();
  seatSave({...seat, rows}, '自动排座');
}
function seatClear(){ if(!confirm('清空全部座位？'))return; const seat=seatSnapshot(); seat.rows=[]; seatSave(seat, '清空全部座位'); }
// 一键补齐缺座：把未安排的学生依次填入空座位（不破坏已有排布；座位不够则追加整行）
async function seatFillMissing(){
  const seat = seatSnapshot();
  const colMap=[]; for(let g=0;g<seat.layout.length;g++){ for(let i=0;i<seat.layout[g];i++) colMap.push(true); if(g<seat.layout.length-1) colMap.push(false); }
  const placed = new Set(seat.rows.flat().filter(v => v && stuById(v)).map(Number));
  const rest = stuSorted().filter(s=>!placed.has(s.id)).map(s=>s.id);
  if (!rest.length){ toast('没有缺座的学生'); return; }
  const n = rest.length;
  for (let r=0; r<seat.rows.length && rest.length; r++){
    const row = seat.rows[r]; if(!row) continue;
    for (let c=0; c<row.length; c++) if (colMap[c] && (!row[c] || !stuById(row[c])) && rest.length) row[c] = rest.shift();
  }
  while (rest.length){
    const row = Array(colMap.length).fill(null);
    for (let c=0;c<colMap.length;c++) if (colMap[c] && rest.length) row[c] = rest.shift();
    seat.rows.push(row);
  }
  seatSave(seat, `补齐 ${n} 个缺座`);
}
function seatLayoutModal(){
  const seat = seatSnapshot();
  const m = openModal(`${modalHead('🔲 座次布局')}
    <div class="m-body">
      <div class="field"><label>当前布局：每排 ${seat.layout.join('·')}（左·中·右）</label>
        <div class="head-actions">${LAYOUT_PRESETS.map(l=>`<button class="btn sm lp ${l.join()===seat.layout.join()?'primary':''}" data-l="${l.join()}">${l.join('·')}</button>`).join('')}</div></div>
      <div class="field"><label>自定义（用 - 或 · 分隔，如 2-4-2）</label><input id="sl-custom" placeholder="2-3-2"></div>
      <div class="hint">修改布局后，现有座位按就近顺序自动重排到新列数（不丢人）。</div>
    </div>
    <div class="m-foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="sl-ok">确定</button></div>`);
  m.querySelectorAll('.lp').forEach(b=>b.onclick=()=>{ m.querySelector('#sl-custom').value=b.dataset.l.split(',').join('-'); });
  m.querySelector('#sl-ok').onclick=()=>{
    const v = m.querySelector('#sl-custom').value.trim();
    const layout = v.split(/[-·.×x]/).map(Number).filter(n=>n>0&&n<=8);
    if (!layout.length) return alert('布局格式不对，例：2-3-2');
    // 重排：按旧顺序铺人
    const old = seat.rows.flat().filter(Boolean);
    const perRow = layout.reduce((a,b)=>a+b,0);
    const colTotal = perRow + layout.length-1;
    const nRows = Math.max(1, Math.ceil(old.length/perRow));
    const rows = Array.from({length:nRows},()=>Array(colTotal).fill(null));
    const colMap=[]; for(let g=0;g<layout.length;g++){ for(let i=0;i<layout[g];i++) colMap.push(true); if(g<layout.length-1) colMap.push(false); }
    let k=0;
    for (let r=0;r<nRows;r++) for (let c=0;c<colTotal;c++) if (colMap[c] && k<old.length) rows[r][c]=old[k++];
    while (rows.length && rows[rows.length-1].every(x=>!x)) rows.pop();
    closeModal(); seatSave({layout, rows}, '布局调整为 '+layout.join('·'));
  };
}
function seatExportModal(){

  const seatCols = colMap.map((v,i)=>v?i:-1).filter(i=>i>=0);

      <div style="overflow:auto;max-height:320px;border:1px solid var(--line);border-radius:8px;padding:8px">${html}</div></div>
    <div class="m-foot"><button class="btn" onclick="closeModal()">关闭</button>

      <button class="btn primary" id="se-dl">⬇ 下载表格</button></div>`, true);
  m.querySelector('#se-copy').onclick=()=>{ navigator.clipboard.writeText(html).then(()=>toast('已复制 HTML 表格')); };
  m.querySelector('#se-dl').onclick=()=>{
    const blob=new Blob(['<meta charset="utf-8">'+html],{type:'application/vnd.ms-excel'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='座次表.xls'; a.click();

$('#tb-teacher').onclick = async () => {
  const v = prompt('班主任姓名', S.settings.teacher_name||'');
  if (v===null) return;
  await api('/settings','PUT',{teacher_name:v});
  await refresh();
};

/* ---------- 启动 ---------- */
(async function init(){
  try {
    S = await api('/state');
    renderTop(); renderNav(); render();
  } catch (e) {
    $('#main').innerHTML = `<div class="card"><b>加载失败：</b>${esc(e.message)}<br><span class="hint">请确认已部署 Worker 并绑定 D1 数据库（见 DEPLOY.md）。</span></div>`;
  }
})();
</script>
</body>
