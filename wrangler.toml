name = "sourden-workbench"
main = "./worker.js"
compatibility_date = "2024-11-01"

# 前端静态资源由 [assets] 托管；Worker 只处理 /api/*，其余交给 ASSETS 渲染 SPA
[assets]
directory = "./public"
not_found_handling = "single-page-application"

# D1 数据库绑定（database_id 在 Cloudflare → D1 → 你的库 → 概览 里复制）
[[d1_databases]]
binding = "DB"
database_name = "sourden-workbench"
database_id = "cd76c73a-b70b-4a58-af54-fb0c200a900b"

# 打开日志便于排查
[observability]
enabled = true

# 定时任务（Cloudflare cron 用的是 UTC）
#   */5 * * * *  → 每 5 分钟检查待办提醒（5 能整除 60，与北京时区无关）
#   0 15 * * *   → 每天 23:00 北京时间（15:00 UTC）兜底跑一次就餐自动上报
[triggers]
crons = ["*/5 * * * *", "0 15 * * *"]
